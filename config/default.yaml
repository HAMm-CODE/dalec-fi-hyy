# Default configuration for the FI-Hyy DALEC2 assimilation.
#
# Everything that could reasonably differ between runs lives here. Nothing in
# src/dalec hard-codes a path, a year, a seed or a parameter name.
#
# Paths are relative to the repository root unless absolute.

# --- Provenance --------------------------------------------------------------
# A single master seed. Every stochastic step (Morris sampling, synthetic-twin
# noise, NUTS chains) derives its seed from this one and records it in the
# output, so a run is reproducible from the config alone.
seed: 20260809

# --- Site --------------------------------------------------------------------
site:
  code: FI-Hyy
  name: Hyytiala
  # Evergreen needleleaf forest (Scots pine). Being evergreen is the ecological
  # ground for fixing the five phenology parameters in Phase 4.
  igbp: ENF

  # --- Fixed ACM site constant. REQUIRED, no default. -----------------------
  # Latitude drives the day length term of Chuter et al. Eq. 12 and is the only
  # site constant ACM needs. dalec.acm.acm_from_config raises rather than
  # guessing it. Confirm against the site metadata: a latitude sign or magnitude
  # error is silent and severe, since day length is what carries the seasonal
  # cycle of photosynthesis at 62 N.
  latitude_deg: 61.8474
  longitude_deg: 24.2948

  # Canopy height and the leaf-to-soil water potential difference were required
  # while ACM was implemented from Williams et al. (1997). DALEC does not use
  # that form: canopy height does not appear in its conductance equation at all,
  # and the water potential is a coefficient of the site-calibrated parameter
  # set rather than a config value. Both are gone. See src/dalec/acm.py.

# --- Photosynthesis (ACM) ----------------------------------------------------
acm:
  # No carbon is fixed below this average daily temperature. ACM was calibrated
  # over 7-30 degC (Williams et al. Table 1) and must not extrapolate; -2.0 is
  # the precedent those authors applied at their Oregon coniferous sites.
  #
  # This was previously described here as load-bearing, on the measurement that
  # nothing else could suppress the winter GPP floor. That measurement was made
  # against the Williams et al. (1997) day length term, which contains no
  # latitude and overstates midwinter at this site by roughly 12x. Under the
  # DALEC form the floor is far smaller and the cutoff no longer carries that
  # weight. It is retained on its original published justification -- refusing to
  # extrapolate below the calibration range -- and its effect is measured.
  frost_threshold_degc: -2.0

# --- Paths -------------------------------------------------------------------
paths:
  raw_dir: data/raw
  processed_dir: data/processed
  results_dir: results
  # FLUXNET2015 FULLSET daily file. FULLSET, not SUBSET: SUBSET omits
  # NEE_VUT_REF_RANDUNC, which is the standard deviation of the likelihood.
  fluxnet_file: data/raw/FLX_FI-Hyy_FLUXNET2015_FULLSET_DD_1996-2014_1-4.csv
  processed_file: data/processed/fi_hyy_dalec_inputs.nc

# --- Data screening ----------------------------------------------------------
data:
  # NEE_VUT_REF_QC at daily resolution is the fraction of the day that is
  # measured or good-quality gap-filled. Days below this threshold are masked
  # out of the likelihood; they are NOT dropped from the time series, because
  # the forward model has to integrate continuously through them.
  qc_threshold: 0.75

# --- Calibration / prediction design ------------------------------------------
# A contiguous calibration block followed by a forward run over a contiguous
# held-out block (Richardson et al. 2010). Both are inclusive year ranges, and
# they abut, so the forward run integrates straight from the start of
# calibration to the end of prediction with no un-assimilated bridge year.
#
#   calibration  1997-2010   5113 days, 4413 assimilable (86.3%)
#   prediction   2011-2014   1461 days,  810 assimilable (55.4%)
#
# Coverage is deliberately not the selection criterion -- see DECISIONS.md for
# why record length is the binding requirement for the slow pools. 1996 is the
# one year excluded, and on driver completeness rather than coverage. What the
# remaining coverage costs, per window:
#
#   2005  the 06-06..09-05 RANDUNC gap removes an entire growing season.
#   2010-2011  a single RANDUNC gap, 2010-11-04..2011-06-23, straddles the split.
#   2014  356 QC-passing days at mean QC 0.974, and *zero* RANDUNC values for the
#         entire year -- so no day of 2014 can score against observed NEE.
years:
  # AUTHORITATIVE, decided 2026-08-26. The Richardson et al. (2010) split: a long
  # calibration record, then a forward run over a held-out contiguous block.
  #
  # The length is the point. DALEC's slow pools (wood, soil organic matter) turn
  # over on timescales of years to decades, and a short record cannot identify
  # them at all -- the window never sees enough of a turnover cycle for the data
  # to tell one rate from another. Following a published design also keeps the
  # window from being chosen to suit the record.
  #
  # 1996 is excluded on driver completeness, not on coverage: CO2_F_MDS is
  # missing for 1996-01-01 to 1996-01-19. 1997-2014 is entirely gap-free, so the
  # calibration block contains NO imputed driver values. See DECISIONS.md.
  calibration: [1997, 2010]
  prediction: [2011, 2014]

# --- Fixed parameters --------------------------------------------------------
# Parameters held at a constant value instead of being sampled. Populated in
# Phase 4 (the five phenology parameters, on evergreen grounds) and extended in
# Phase 5 from the Morris screening. Keys must match names in the
# dalec.parameters registry.
fixed_parameters: {}

# --- Morris screening (Phase 5) ----------------------------------------------
morris:
  trajectories: 200
  num_levels: 4
  # Screening runs the NumPy forward model over this block. Defaults to the
  # calibration block when null.
  years: null

# --- Sampler (Phase 6 onwards) -----------------------------------------------
# NUTS only. No alternative samplers, by design.
sampler:
  draws: 1000
  tune: 1000
  chains: 4
  cores: 4
  target_accept: 0.9
  max_treedepth: 10

# --- Synthetic twin (Phase 7) ------------------------------------------------
synthetic:
  # Noise is drawn with the per-day sd taken from the real RANDUNC series, so
  # the twin inherits the real observation-error structure.
  years: null   # defaults to the calibration block when null

# --- Diagnostics (Phase 8) ---------------------------------------------------
diagnostics:
  rhat_threshold: 1.1
  hdi_prob: 0.94
  figure_format: pdf
  figure_dpi: 300
